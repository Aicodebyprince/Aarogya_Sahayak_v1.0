          REQUIRED: true
          LOCATION: body
      - cohort_file:
          TYPE: BINARY
          REQUIRED: true
          LOCATION: body
          FORMAT: binary
      - cohort_transformation_file:
          TYPE: BINARY
          REQUIRED: true
          LOCATION: body
          FORMAT: binary
    RETURNS:
      - RETURNTYPE: STRUCT(CohortMetadata)
