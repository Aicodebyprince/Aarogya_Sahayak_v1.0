  sarvam_voice_agents.auth.create:
    SUMMARY: Obtain a JWT Access Token
    DESC: |
      If using the Client Credentials method, Samvaad will call this endpoint to exchange its **Client ID** and **Client Secret** for a short-lived JWT Bearer token.

      Samvaad will authenticate to this endpoint using **HTTP Basic Authentication**. The returned access token will be cached and used in the `Authorization` header for all subsequent API calls until it expires.

      **Note:** This endpoint is not needed if you opt for the static API Key authentication method.
    HTTP:
      METHOD: POST
      ENDPOINT: /auth
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(obtainAJwtAccessToken_post_auth_b88b1a6Request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Authorization:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - x-request-id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
          FORMAT: uuid
      - x-trace-id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
          FORMAT: uuid
      - x-request-timestamp:
          TYPE: TIMESTAMP
          REQUIRED: true
          LOCATION: header
          FORMAT: date-time
      - body:
          TYPE: STRUCT(obtainAJwtAccessToken_post_auth_b88b1a6Request)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(AuthSuccessResponse)
        RETURNVAR: sarvam_voice_agents_auth_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Bad Request. The request is syntactically malformed. (HTTP 400)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 401
        WHEN: Unauthorized. The provided Client ID or Client Secret is invalid. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: Unprocessable Entity. The request is well-formed but contains semantic errors (e.g., wrong grant_type). (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: Internal Server Error. An unexpected error occurred on the authentication server. (HTTP 500)
    CANONICAL_ID: sarvam_voice_agents.auth.create
  sarvam_voice_agents.decrypt_key.create:
    SUMMARY: Decrypt an Encrypted Data Encryption Key (DEK)
    DESC: |
      Samvaad calls this endpoint to decrypt an Encrypted Data Encryption Key (EDEK) using the corresponding master key in your Key Management System (KMS) or HSM.

      The plaintext key is then cached securely in memory by Samvaad for a short, configurable duration to perform data encryption and decryption operations. The `key_alias` is used to identify which master key should be used for decryption.
    HTTP:
      METHOD: POST
      ENDPOINT: /decrypt-key
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(decryptAnEncryptedDataEncryptionKeyDek_post_decrypt_key_b6f99225Request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Authorization:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - x-request-id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
          FORMAT: uuid
      - x-trace-id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
          FORMAT: uuid
      - x-request-timestamp:
          TYPE: TIMESTAMP
          REQUIRED: true
          LOCATION: header
          FORMAT: date-time
      - body:
          TYPE: STRUCT(decryptAnEncryptedDataEncryptionKeyDek_post_decrypt_key_b6f99225Request)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(DecryptKeySuccessResponse)
        RETURNVAR: sarvam_voice_agents_decrypt-key_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Bad Request. The request body is syntactically malformed. (HTTP 400)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 401
        WHEN: Unauthorized. The Bearer token is missing, invalid, or expired. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 404
        WHEN: Not Found. The specified `key_alias` does not exist or is not active in your KMS. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: Unprocessable Entity. The request is well-formed but contains semantic errors. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: Internal Server Error. An unexpected error occurred within your key management infrastructure (e.g., KMS, HSM). (HTTP 500)
    CANONICAL_ID: sarvam_voice_agents.decrypt-key.create
  sarvam_voice_agents.rotate_key.create:
    SUMMARY: Generate a New Data Encryption Key (DEK)
    DESC: |
      Samvaad calls this endpoint to generate a new Data Encryption Key (DEK). This is part of the key rotation strategy.
      You must return both the new plaintext DEK and its encrypted form (the EDEK) along with the key-alias used for encyption. Samvaad will use this new key for all subsequent encryption operations for the associated data.
    HTTP:
      METHOD: POST
      ENDPOINT: /rotate-key
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Authorization:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - x-request-id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
          FORMAT: uuid
      - x-trace-id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
          FORMAT: uuid
      - x-request-timestamp:
          TYPE: TIMESTAMP
          REQUIRED: true
          LOCATION: header
          FORMAT: date-time
    RETURNS:
      - RETURNTYPE: STRUCT(RotateKeySuccessResponse)
        RETURNVAR: sarvam_voice_agents_rotate-key_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Bad Request. The request body is syntactically malformed. (HTTP 400)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 401
        WHEN: Unauthorized. The Bearer token is missing, invalid, or expired. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: Unprocessable Entity. The request is well-formed but contains semantic errors. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: Internal Server Error. An unexpected error occurred within your key management infrastructure during key generation. (HTTP 500)
    CANONICAL_ID: sarvam_voice_agents.rotate-key.create
