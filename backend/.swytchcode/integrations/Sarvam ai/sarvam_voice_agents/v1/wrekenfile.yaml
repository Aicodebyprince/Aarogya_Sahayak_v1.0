      Create a new deployment that connects an agent to a phone number for inbound calls.

      The deployment is created in `active` status and immediately begins accepting calls. Optionally configure an `inbound_config` schedule to restrict calls to specific hours and days.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/orgs/{org_id}/workspaces/{workspace_id}/deployments
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(CreateDeployment)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - org_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - workspace_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(CreateDeployment)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(DeploymentDetails)
        RETURNVAR: sarvam_voice_agents_workspace_deployments_create
