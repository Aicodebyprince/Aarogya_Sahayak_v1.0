      **Supported Languages (BCP-47 format):**
      - `hi-IN`: Hindi (default)
      - `en-IN`: English
      - `bn-IN`: Bengali
      - `gu-IN`: Gujarati
      - `kn-IN`: Kannada
      - `ml-IN`: Malayalam
      - `mr-IN`: Marathi
      - `od-IN`: Odia
      - `pa-IN`: Punjabi
      - `ta-IN`: Tamil
      - `te-IN`: Telugu
      - `ur-IN`: Urdu
      - `as-IN`: Assamese
      - `brx-IN`: Bodo
      - `doi-IN`: Dogri
      - `ks-IN`: Kashmiri
      - `kok-IN`: Konkani
      - `mai-IN`: Maithili
      - `mni-IN`: Manipuri
      - `ne-IN`: Nepali
      - `sa-IN`: Sanskrit
      - `sat-IN`: Santali
      - `sd-IN`: Sindhi

      **Output Formats (delivered as ZIP file):**
      - `html`: Structured HTML files with layout preservation
      - `md`: Markdown files (default)
      - `json`: Structured JSON files for programmatic processing
    HTTP:
      METHOD: POST
      ENDPOINT: /doc-digitization/job/v1
      HEADERS:
