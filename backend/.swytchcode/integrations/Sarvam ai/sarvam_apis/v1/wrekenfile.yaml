VERSION: 2.0.2
DEFAULTS:
  api-subscription-key: <API-SUBSCRIPTION-KEY>
  bearer_token: BEARER <TOKEN>
  w_base_url: https://api.sarvam.ai
METHODS:
  sarvam_apis.speech_to_text.create:
    SUMMARY: Speech to Text
    DESC: |-
      ## Speech to Text API

      This API transcribes speech to text in multiple Indian languages and English. Supports transcription for interactive applications.

      ### Available Options:
      - **REST API** (Current Endpoint): For quick responses under 30 seconds with immediate results
      - **Batch API**: For longer audio files, [Follow This Documentation](https://docs.sarvam.ai/api-reference-docs/api-guides-tutorials/speech-to-text/batch-api)
        - Supports diarization (speaker identification)

      ### Note:
      - Pricing differs for REST and Batch APIs
      - Diarization is only available in Batch API with separate pricing
      - Please refer to [here](https://docs.sarvam.ai/api-reference-docs/pricing) for detailed pricing information
    HTTP:
      METHOD: POST
      ENDPOINT: /speech-to-text
      HEADERS:
        Content-Type: multipart/form-data
      CONTENT_TYPE: multipart/form-data
      ACCEPT: application/json
      BODYTYPE: form-data
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - file:
          TYPE: BINARY
          REQUIRED: true
          LOCATION: body
          FORMAT: binary
      - model:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - mode:
          TYPE: STRUCT(transcribe_post_speech_to_text_2a3dffaeRequest_mode)
          REQUIRED: false
          LOCATION: body
          DEFAULT: transcribe
      - language_code:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - with_timestamps:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: body
          DEFAULT: false
      - input_audio_codec:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Sarvam_Model_API_SpeechToTextResponse)
        RETURNVAR: sarvam_apis_speech-to-text_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 503
        WHEN: Service Overloaded (HTTP 503)
    CANONICAL_ID: sarvam_apis.speech-to-text.create
  sarvam_apis.job.create3:
    SUMMARY: Initiate Speech to Text Bulk Job V1
    DESC: Create a new speech to text bulk job and receive a job UUID and storage folder details for processing multiple audio files. Set `job_parameters.input_audio_codec` when uploads are raw PCM (`pcm_s16le`, `pcm_l16`, or `pcm_raw`); the API auto-detects other formats. PCM must be 16 kHz.
    HTTP:
      METHOD: POST
      ENDPOINT: /speech-to-text/job/v1
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(BulkJobInitRequestV1_SpeechToTextJobParameters_)
    EXECUTION:
      KIND: http
      MODE: async
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - body:
          TYPE: STRUCT(BulkJobInitRequestV1_SpeechToTextJobParameters_)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(BulkJobInitResponse)
        RETURNVAR: sarvam_apis_job_create3_202
        STATUS: 202
    ERRORS:
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 503
        WHEN: Service Overloaded (HTTP 503)
    CANONICAL_ID: sarvam_apis.job.create3
  sarvam_apis.job.uploadFiles.create2:
    SUMMARY: Upload Files for Speech to Text Bulk Job V1
    DESC: Generate presigned upload URLs for audio files that will be processed in a speech to text bulk job
    HTTP:
      METHOD: POST
      ENDPOINT: /speech-to-text/job/v1/upload-files
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(FilesRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - body:
          TYPE: STRUCT(FilesRequest)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(FilesUploadResponse)
        RETURNVAR: sarvam_apis_job_uploadFiles_create2
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 503
        WHEN: Service Overloaded (HTTP 503)
    CANONICAL_ID: sarvam_apis.job.uploadFiles.create2
  sarvam_apis.job.start2:
    SUMMARY: Start Speech to Text Bulk Job V1
    DESC: Start processing a speech to text bulk job after all audio files have been uploaded
    HTTP:
      METHOD: POST
      ENDPOINT: /speech-to-text/job/v1/{job_id}/start
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - job_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - ptu_id:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
          DEFAULT: ""
    RETURNS:
      - RETURNTYPE: STRUCT(JobStatusResponse)
        RETURNVAR: sarvam_apis_job_start2
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 503
        WHEN: Service Overloaded (HTTP 503)
    CANONICAL_ID: sarvam_apis.job.start2
  sarvam_apis.job.status.get3:
    SUMMARY: Get Speech to Text Bulk Job V1 Status
    DESC: |-
      Retrieve the current status and details of a speech to text bulk job, including progress and file-level information.

      **Rate Limiting Best Practice:** To prevent rate limit errors and ensure optimal server performance, we recommend implementing a minimum 5-millisecond delay between consecutive status polling requests. This helps maintain system stability while still providing timely status updates.
    HTTP:
      METHOD: GET
      ENDPOINT: /speech-to-text/job/v1/{job_id}/status
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - job_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
          DEFAULT: ""
    RETURNS:
      - RETURNTYPE: STRUCT(JobStatusResponse)
        RETURNVAR: sarvam_apis_job_status_get3
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 503
        WHEN: Service Overloaded (HTTP 503)
    CANONICAL_ID: sarvam_apis.job.status.get3
  sarvam_apis.job.downloadFiles.create2:
    SUMMARY: Download Files for Speech to Text Bulk Job V1
    DESC: |-
      Generate presigned download URLs for the transcription output files of a completed speech to text bulk job.

      **Required body fields:** `job_id` and `files` (array of output filenames such as `"0.json"`). Obtain filenames from the job status response (`job_details[].outputs[].file_name`) after the job reaches `Completed` or `PartiallyCompleted`.

      **Method:** POST only (GET returns 405).
    HTTP:
      METHOD: POST
      ENDPOINT: /speech-to-text/job/v1/download-files
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(FilesRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - body:
          TYPE: STRUCT(FilesRequest)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(FilesDownloadResponse)
        RETURNVAR: sarvam_apis_job_downloadFiles_create2
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 503
        WHEN: Service Overloaded (HTTP 503)
    CANONICAL_ID: sarvam_apis.job.downloadFiles.create2
  sarvam_apis.text_to_speech.create:
    SUMMARY: Text to Speech
    DESC: |-
      Convert text into spoken audio. The output is a base64-encoded audio string that must be decoded before use.

      **Available Models:**
      - **bulbul:v3**: Latest model with improved quality, 30+ voices, and temperature control
      - **bulbul:v2**: Legacy model with pitch and loudness controls

      **Important Notes for bulbul:v3:**
      - Pitch and loudness parameters are NOT supported
      - Pace range: 0.5 to 2.0
      - Preprocessing is automatically enabled
      - Default sample rate is 24000 Hz
      - Supports sample rates: 8000, 16000, 22050, 24000 Hz (REST API also supports 32000, 44100, 48000 Hz)
    HTTP:
      METHOD: POST
      ENDPOINT: /text-to-speech
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Sarvam_Model_API_TextToSpeechRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - body:
          TYPE: STRUCT(Sarvam_Model_API_TextToSpeechRequest)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(Sarvam_Model_API_TextToSpeechResponse)
        RETURNVAR: sarvam_apis_text-to-speech_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.text-to-speech.create
  sarvam_apis.stream.create:
    SUMMARY: Text-to-Speech Stream Audio
    DESC: |-
      Converts the input text into a streamed spoken audio response.

      This endpoint supports streaming audio using the specified output codec (e.g., `audio/mpeg` for MP3). The response is returned as a binary audio stream, which can be played or saved directly by the client.

      Supports the `dict_id` parameter to apply a [pronunciation dictionary](https://docs.sarvam.ai/api-reference-docs/pronunciation-dictionary/create) during synthesis.
    HTTP:
      METHOD: POST
      ENDPOINT: /text-to-speech/stream
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/octet-stream
      BODY:
        TYPE: STRUCT(Sarvam_Model_API_TextToSpeechStreamRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - body:
          TYPE: STRUCT(Sarvam_Model_API_TextToSpeechStreamRequest)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: ANY
        RETURNVAR: sarvam_apis_stream_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.stream.create
  sarvam_apis.pronunciation_dictionary.create:
    SUMMARY: Create Pronunciation Dictionary
    DESC: |-
      Upload a `.json` file to create a new pronunciation dictionary. Only supported by **bulbul:v3**.

      The file should contain a JSON object with a `pronunciations` key mapping language codes to word-pronunciation pairs. See the [Pronunciation Dictionary guide](/api-reference-docs/api-guides-tutorials/text-to-speech/pronunciation-dictionary) for format details and examples.

      The returned `dictionary_id` can be passed as `dict_id` in text-to-speech requests (REST, HTTP Stream, and WebSocket).

      **Limits:** Max 10 dictionaries per user, 100 words per dictionary, 1 MB file size.
    HTTP:
      METHOD: POST
      ENDPOINT: /text-to-speech/pronunciation-dictionary
      HEADERS:
        Content-Type: multipart/form-data
      CONTENT_TYPE: multipart/form-data
      ACCEPT: application/json
      BODYTYPE: form-data
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - file:
          TYPE: BINARY
          REQUIRED: true
          LOCATION: body
          FORMAT: binary
    RETURNS:
      - RETURNTYPE: STRUCT(Sarvam_Model_API_PronunciationDictionaryResponse)
        RETURNVAR: sarvam_apis_pronunciation-dictionary_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 400
        WHEN: Bad Request — Invalid JSON, missing required fields, or bad schema. (HTTP 400)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 413
        WHEN: Payload Too Large — File size exceeds the 1 MB limit. (HTTP 413)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity — Word limit exceeded (>100 words per dictionary) or dictionary limit exceeded (>10 dictionaries per user). (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.pronunciation-dictionary.create
  sarvam_apis.pronunciation_dictionary.list:
    SUMMARY: List Pronunciation Dictionaries
    DESC: Retrieve a list of all pronunciation dictionary IDs associated with the authenticated user.
    HTTP:
      METHOD: GET
      ENDPOINT: /text-to-speech/pronunciation-dictionary
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(Sarvam_Model_API_PronunciationDictionaryGetResponse)
