        **Note:** Speaker selection must match the chosen model version.

        **Important:** Speaker names are case-sensitive and must be lowercase (e.g., `ritu` not `Ritu`).
    - name: pitch
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: |-
        Controls the pitch of the audio. Range: -0.75 to 0.75. Default is 0.0.

        **Note:** Only supported for bulbul:v2.
    - name: pace
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      DEFAULT: 1
      comment: |-
        Controls the speed of the audio. Default is 1.0.

        **Model-specific ranges:**
        - **bulbul:v3:** 0.5 to 2.0
        - **bulbul:v2:** 0.3 to 3.0
    - name: loudness
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: |-
        Controls the loudness of the audio. Range: 0.3 to 3.0. Default is 1.0.

        **Note:** Only supported for bulbul:v2.
    - name: speech_sample_rate
      TYPE: STRUCT(Sarvam_Model_API_TextToSpeechStreamRequest_speech_sample_rate)
      REQUIRED: false
      DEFAULT: 22050
      comment: |-
        Specifies the sample rate of the output audio. Default is 22050 Hz.

        **Note:** OPUS codec only supports 8000, 12000, 16000, 24000, 48000 Hz.
    - name: enable_preprocessing
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: Controls whether normalization of English words and numeric entities is performed. Default is false.
    - name: model
      TYPE: STRING
      REQUIRED: false
      comment: Specifies the model to use for text-to-speech conversion. Default is bulbul:v2.
    - name: temperature
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      DEFAULT: 0.6
      comment: |-
        Controls the randomness of the output. Range: 0.01 to 1.0. Default is 0.6.

        **Note:** Only supported for bulbul:v3.
    - name: enable_cached_responses
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: Enable caching for the request. Default is false. Currently in beta.
    - name: dict_id
      TYPE: STRING
      REQUIRED: false
      comment: |-
        The ID of a pronunciation dictionary to apply during synthesis. When provided, matching words in the input text will be replaced with their custom pronunciations before generating speech.

        Create and manage dictionaries via the [Pronunciation Dictionary API](https://docs.sarvam.ai/api-reference-docs/pronunciation-dictionary/create). Only supported by **bulbul:v3**.
    - name: output_audio_codec
      TYPE: STRING
      REQUIRED: false
      comment: Specifies the codec for the streamed output audio (e.g., 'mp3').
    - name: output_audio_bitrate
      TYPE: STRING
      REQUIRED: false
      comment: Bitrate for the streamed output audio. Default is '128k'.
