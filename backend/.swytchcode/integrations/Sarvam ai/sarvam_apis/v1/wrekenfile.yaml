  CreateChatCompletionRequest:
    - name: messages
      TYPE: "[]STRUCT(ChatCompletionRequestMessage)"
      REQUIRED: true
      comment: A list of messages comprising the conversation so far.
    - name: model
      TYPE: STRING
      REQUIRED: true
      comment: Chat model ID. Use `sarvam-105b` (128K context) for complex reasoning and agentic tasks, or `sarvam-105b-conversations` for real-time conversational and voice-agent workloads.
    - name: temperature
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      DEFAULT: 0.2
      comment: |
        What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.
        We generally recommend altering this or `top_p` but not both.
    - name: top_p
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      DEFAULT: 1
      comment: |
        An alternative to sampling with temperature, called nucleus sampling,
        where the model considers the results of the tokens with top_p probability
        mass. So 0.1 means only the tokens comprising the top 10% probability mass
        are considered.

        We generally recommend altering this or `temperature` but not both.
    - name: reasoning_effort
      TYPE: STRUCT(CreateChatCompletionRequest_reasoning_effort)
      REQUIRED: false
      DEFAULT: medium
      comment: The effort to use for reasoning. Can be disabled by explicitly setting to None. Default is 'medium'.
    - name: max_tokens
      TYPE: INT
      REQUIRED: false
      DEFAULT: 2048
      comment: The maximum number of tokens that can be generated in the chat completion.
    - name: stream
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: |-
        If set to true, the model response data will be streamed to the client
        as it is generated using [server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format).
    - name: stop
      TYPE: STRUCT(CreateChatCompletionRequest_stop)
      REQUIRED: false
    - name: "n"
      TYPE: INT
      REQUIRED: false
      DEFAULT: 1
      comment: How many chat completion choices to generate for each input message. Note that you will be charged based on the number of generated tokens across all of the choices. Keep `n` as `1` to minimize costs.
    - name: seed
      TYPE: INT
      REQUIRED: false
      comment: |
        This feature is in Beta.
        If specified, our system will make a best effort to sample deterministically, such that repeated requests with the same `seed` and parameters should return the same result.
        Determinism is not guaranteed, and you should refer to the `system_fingerprint` response parameter to monitor changes in the backend.
    - name: frequency_penalty
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      DEFAULT: 0
      comment: |
        Number between -2.0 and 2.0. Positive values penalize new tokens based on
        their existing frequency in the text so far, decreasing the model's
        likelihood to repeat the same line verbatim.
    - name: presence_penalty
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      DEFAULT: 0
      comment: |
        Number between -2.0 and 2.0. Positive values penalize new tokens based on
        whether they appear in the text so far, increasing the model's likelihood
        to talk about new topics.
    - name: wiki_grounding
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: If set to true, the model response will be wiki grounded.
    - name: tools
      TYPE: ANY
      REQUIRED: false
      comment: A list of tools the model may call. Currently, only functions are supported as a tool.
    - name: tool_choice
      TYPE: STRUCT(CreateChatCompletionRequest_tool_choice)
      REQUIRED: false
      comment: Controls which (if any) tool is called by the model.
    - name: response_format
      TYPE: STRUCT(CreateChatCompletionRequest_response_format)
      REQUIRED: false
      comment: "An object specifying the format that the model must output. Setting `{ \"type\": \"json_schema\", \"json_schema\": {...} }` enables Structured Outputs which guarantees the model generates output matching the supplied JSON Schema. Setting `{ \"type\": \"json_object\" }` enables the older JSON mode, which guarantees valid JSON but not a specific schema."
  ChatCompletionResponseMessage:
    - name: content
      TYPE: STRING
      REQUIRED: true
      comment: The contents of the message.
    - name: refusal
      TYPE: STRING
      REQUIRED: false
    - name: reasoning_content
      TYPE: STRING
      REQUIRED: false
      comment: The contents of the reasoning message.
    - name: role
      TYPE: STRING
      REQUIRED: true
      comment: The role of the author of this message.
    - name: tool_calls
      TYPE: ANY
      REQUIRED: false
      comment: The tool calls generated by the model.
  Choice:
    - name: finish_reason
      TYPE: STRING
      REQUIRED: true
      comment: |
        The reason the model stopped generating tokens. This will be `stop` if the model hit a natural stop point or a provided stop sequence,
        `length` if the maximum number of tokens specified in the request was reached,
        `content_filter` if content was omitted due to a flag from our content filters,
        `tool_calls` if the model called a tool, or `function_call` (deprecated) if the model called a function.
    - name: index
      TYPE: INT
      REQUIRED: true
      comment: The index of the choice in the list of choices.
