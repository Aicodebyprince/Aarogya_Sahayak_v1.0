        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 400
        WHEN: Bad Request — Invalid JSON, missing required fields, or bad schema. (HTTP 400)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.pronunciation-dictionary.list
  sarvam_apis.pronunciation_dictionary.update:
    SUMMARY: Update Pronunciation Dictionary
    DESC: |-
      Update an existing pronunciation dictionary by uploading a JSON file. You can add new words, change existing pronunciations, or both — entries not included in the uploaded file remain unchanged.

      **Limits:** Max 100 words per dictionary, 1 MB file size.

      The response includes the `dictionary_id` and the updated pronunciation mappings for verification.
    HTTP:
      METHOD: PUT
      ENDPOINT: /text-to-speech/pronunciation-dictionary
      HEADERS:
        Content-Type: multipart/form-data
      CONTENT_TYPE: multipart/form-data
      ACCEPT: application/json
      BODYTYPE: form-data
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - dict_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: query
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - file:
          TYPE: BINARY
          REQUIRED: true
          LOCATION: body
          FORMAT: binary
    RETURNS:
      - RETURNTYPE: STRUCT(Sarvam_Model_API_PronunciationDictionaryUpdateResponse)
        RETURNVAR: sarvam_apis_pronunciation-dictionary_update
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 400
        WHEN: Bad Request — Invalid JSON, missing required fields, or bad schema. (HTTP 400)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 404
        WHEN: Not Found — Dictionary not found. (HTTP 404)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 413
        WHEN: Payload Too Large — File size exceeds the 1 MB limit. (HTTP 413)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity — Word limit exceeded (>100 words per dictionary). (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.pronunciation-dictionary.update
  sarvam_apis.pronunciation_dictionary.delete:
    SUMMARY: Delete Pronunciation Dictionary
    DESC: Delete a pronunciation dictionary by its ID. Once deleted, the dictionary can no longer be referenced in text-to-speech requests.
    HTTP:
      METHOD: DELETE
