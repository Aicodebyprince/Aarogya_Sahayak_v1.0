        STATUS: 400
        WHEN: Bad Request — Invalid JSON, missing required fields, or bad schema. (HTTP 400)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 404
        WHEN: Not Found — Dictionary not found. (HTTP 404)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.pronunciation-dictionary.delete
  sarvam_apis.pronunciation_dictionary.get:
    SUMMARY: Get Pronunciation Dictionary
    DESC: |-
      Retrieve the full pronunciation mappings for a specific dictionary by its ID.

      Returns the pronunciation data organized by language code, where each language contains word-to-pronunciation pairs.
    HTTP:
      METHOD: GET
