  sarvam_apis.job.create1:
    SUMMARY: Create Dubbing Job
    DESC: |-
      ## Creative Agents - Dubbing

      Create a dubbing job that translates a source video or audio file into one or more Indian languages, with optional voice cloning, watermark control, and translation-style (register) control.

      **Base URL:** `https://api.sarvam.ai/dubbing`.
      **Auth:** send your key in the `api-subscription-key` header, not `Authorization: Bearer`.

      This call only creates the job. It does not accept the media file. The response returns `data.job_id` and a short-lived signed `data.upload_url`. After that:
      1. `PUT` the raw media bytes to `upload_url` with headers `Content-Type: <mime>` (e.g. `video/mp4`) and `x-ms-blob-type: BlockBlob`.
      2. `POST /jobs/{job_id}/start` to begin the pipeline.

      A single job dubs into every language in `target_langs`, so you don't need a separate job per language.
    HTTP:
      METHOD: POST
      ENDPOINT: /jobs
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Sarvam_Creative_API_CreateDubbingJobRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - body:
          TYPE: STRUCT(Sarvam_Creative_API_CreateDubbingJobRequest)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(Sarvam_Creative_API_CreateDubbingJobResponse)
        RETURNVAR: sarvam_apis_job_create1
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 401
        WHEN: Unauthorized. Send a valid `api-subscription-key`. (HTTP 401)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity. The body is invalid; check enum values and required fields. (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.job.create1
  sarvam_apis.start.create:
    SUMMARY: Start Dubbing Job
    DESC: |-
      Start a dubbing job once the media file has been uploaded to the signed `upload_url` returned by `POST /jobs`. The job status then moves from `queued` to `in_progress`, and finally to `completed` or `failed`.

      Keep `editor_flow` set to `false` (the default) when creating the job so exports auto-produce once the pipeline finishes.
    HTTP:
      METHOD: POST
      ENDPOINT: /jobs/{job_id}/start
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - job_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(Sarvam_Creative_API_DubbingStartResponse)
        RETURNVAR: sarvam_apis_start_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 401
        WHEN: Unauthorized. Send a valid `api-subscription-key`. (HTTP 401)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.start.create
  sarvam_apis.live_statu.get:
    SUMMARY: Get Dubbing Live Status
    DESC: |-
      Poll the pipeline progress of a dubbing job. `data.status` moves from `queued` to `in_progress`, then to `completed` or `failed`.

      > **Note:** `live-status` is a progress signal only. The source of truth for downloadable outputs is `GET /jobs/{job_id}/export-status`. Each `(target_language, export_type)` export completes independently and carries its own `status` and `download_url`.
    HTTP:
      METHOD: GET
      ENDPOINT: /jobs/{job_id}/live-status
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - job_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(Sarvam_Creative_API_DubbingLiveStatusResponse)
        RETURNVAR: sarvam_apis_live-statu_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 401
        WHEN: Unauthorized. Send a valid `api-subscription-key`. (HTTP 401)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.live-statu.get
  sarvam_apis.export_statu.get:
    SUMMARY: Get Dubbing Export Status
    DESC: |-
      Retrieve the per-output export status for a dubbing job. Returns `data.exports[]`, one entry per `(target_language, export_type)` combination, each with its own `status` and signed `download_url`.

      **This is the source of truth for downloads.** Before downloading, confirm an entry's `status == "completed"` and use its `download_url`.

      > Signed download URLs are time-limited (~24h). Re-fetch this endpoint for a fresh URL rather than caching long-term.
    HTTP:
      METHOD: GET
      ENDPOINT: /jobs/{job_id}/export-status
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - job_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 5
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(Sarvam_Creative_API_DubbingExportStatusResponse)
        RETURNVAR: sarvam_apis_export-statu_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 401
        WHEN: Unauthorized. Send a valid `api-subscription-key`. (HTTP 401)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.export-statu.get
  sarvam_apis.job.upload:
    SUMMARY: Create Document AI Upload URL
    DESC: |-
      Creates a direct-upload handle for a file to be processed later.

      **Flow:**
      1. Call this endpoint with the MIME type you will upload (e.g. `application/pdf`).
      2. Upload the file using the returned `method`, `url` and `headers` before `expires_at`.
      3. Pass the returned `upload_id` through the `upload_ids` field on a later digitise or extract job request.

      When `content_type` is set, the upload's `Content-Type` header must match it.
    HTTP:
      METHOD: POST
      ENDPOINT: /doc-ai/v1/job/upload
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(DocAIPresignUploadRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - body:
          TYPE: STRUCT(DocAIPresignUploadRequest)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(DocAIPresignUploadResponse)
        RETURNVAR: sarvam_apis_job_upload_201
        STATUS: 201
    ERRORS:
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 400
        WHEN: Invalid request (HTTP 400)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 402
        WHEN: Billing or entitlement error (HTTP 402)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 429
        WHEN: Rate or admission limit exceeded (HTTP 429)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 503
        WHEN: Billing unavailable (HTTP 503)
    CANONICAL_ID: sarvam_apis.job.upload
  sarvam_apis.job.digitise.create:
    SUMMARY: Create Document AI Digitise Job
    DESC: |-
      Creates and starts a digitise job from files or pre-uploaded handles. Digitise converts documents into structured HTML, Markdown, or JSON while preserving layout.

      **Input:** Exactly one of `file` and `upload_ids` must be provided. Use `POST /doc-ai/v1/job/upload` to obtain upload IDs.

      **Processing:** the job runs asynchronously. Poll `GET /doc-ai/v1/job/{job_id}/status` until a terminal status (`completed`, `partially_completed`, `failed`, `rejected`), then fetch output via the results or download-url endpoints.

      Digitise JSON results include blocks with text, tag and bounding box.
    HTTP:
      METHOD: POST
      ENDPOINT: /doc-ai/v1/job/digitise
      HEADERS:
        Content-Type: multipart/form-data
      CONTENT_TYPE: multipart/form-data
      ACCEPT: application/json
      BODYTYPE: form-data
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - file:
          TYPE: "[]BINARY"
          REQUIRED: false
          LOCATION: body
      - upload_ids:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - language:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
          DEFAULT: en-IN
      - output_format:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
          DEFAULT: html
      - content_type:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
          DEFAULT: printed
      - model:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
          DEFAULT: sarvam-vision-v1
    RETURNS:
      - RETURNTYPE: STRUCT(DocAIStartJobResponse)
        RETURNVAR: sarvam_apis_job_digitise_create_201
        STATUS: 201
    ERRORS:
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 400
        WHEN: Invalid request or schema (HTTP 400)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 402
        WHEN: Billing or entitlement error (HTTP 402)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 413
        WHEN: File too large (HTTP 413)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 429
        WHEN: Rate or admission limit exceeded (HTTP 429)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 503
        WHEN: Billing unavailable (HTTP 503)
    CANONICAL_ID: sarvam_apis.job.digitise.create
  sarvam_apis.job.extract.create:
    SUMMARY: Create Document AI Extract Job
    DESC: |-
      Creates and starts an extract job from files or pre-uploaded handles. Extract pulls structured fields out of documents according to a schema.

      **Input:** Exactly one of `file` and `upload_ids` must be provided.

      **Schema:** exactly one of `schema` (inline JSON schema) and `config_id` (saved extraction configuration) is required.

      **Processing:** the job runs asynchronously. Poll `GET /doc-ai/v1/job/{job_id}/status` until a terminal status (`completed`, `partially_completed`, `failed`, `rejected`), then fetch output via the results or download-url endpoints.

      Extract results include `result`, plus `annotations` mirroring the result shape where every leaf has `confidence` and `sources`.
    HTTP:
      METHOD: POST
      ENDPOINT: /doc-ai/v1/job/extract
      HEADERS:
        Content-Type: multipart/form-data
      CONTENT_TYPE: multipart/form-data
      ACCEPT: application/json
      BODYTYPE: form-data
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - file:
          TYPE: "[]BINARY"
          REQUIRED: false
          LOCATION: body
      - upload_ids:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - schema:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - config_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - language:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
          DEFAULT: en-IN
      - output_format:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
          DEFAULT: json
      - classification:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
          DEFAULT: "false"
      - model:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
          DEFAULT: sarvam-vision-v1
    RETURNS:
      - RETURNTYPE: STRUCT(DocAIStartJobResponse)
        RETURNVAR: sarvam_apis_job_extract_create_201
        STATUS: 201
    ERRORS:
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 400
        WHEN: Invalid request or schema (HTTP 400)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 402
        WHEN: Billing or entitlement error (HTTP 402)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 413
        WHEN: File too large (HTTP 413)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 429
        WHEN: Rate or admission limit exceeded (HTTP 429)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 503
        WHEN: Billing unavailable (HTTP 503)
    CANONICAL_ID: sarvam_apis.job.extract.create
  sarvam_apis.job.status.get:
    SUMMARY: Get Document AI Job Status
    DESC: |-
      Returns a job's status and page-level usage.

      **Terminal statuses:** `completed`, `partially_completed`, `failed`, `rejected`. Results and download URLs are only available after the job reaches a terminal status.
    HTTP:
      METHOD: GET
      ENDPOINT: /doc-ai/v1/job/{job_id}/status
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - job_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(DocAIJobStatusResponse)
        RETURNVAR: sarvam_apis_job_status_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 404
        WHEN: Job not found (HTTP 404)
    CANONICAL_ID: sarvam_apis.job.status.get
  sarvam_apis.job.results.get:
    SUMMARY: Get Document AI Job Results
    DESC: |-
      Returns terminal job results. Results are never available while a job is running; requesting them before a terminal status returns `409`.

      **Digitise results** include `job_id`, `type`, `status`, `usage` and `documents`.

      **Extract results** include `job_id`, `type`, `status`, `usage`, `result`, `annotations` and `version`. `annotations` mirrors the result shape; every leaf has `confidence` and `sources`.
    HTTP:
      METHOD: GET
      ENDPOINT: /doc-ai/v1/job/{job_id}/results
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - job_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - format:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(docAI_get_results_Response_200)
        RETURNVAR: sarvam_apis_job_results_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 404
        WHEN: Job not found (HTTP 404)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 409
        WHEN: Results requested before the job reached a terminal status (HTTP 409)
    CANONICAL_ID: sarvam_apis.job.results.get
  sarvam_apis.job.downloadUrl.get:
    SUMMARY: Get Document AI Download URL
    DESC: |-
      Creates a download URL for a completed job's output. Download the output using the returned `method`, `url` and `headers` before `expires_at`.

      Requesting a download URL before the job reaches a terminal status returns `409`.
    HTTP:
      METHOD: GET
      ENDPOINT: /doc-ai/v1/job/{job_id}/download-url
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - job_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(DocAIDownloadURLResponse)
        RETURNVAR: sarvam_apis_job_downloadUrl_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 404
        WHEN: Job not found (HTTP 404)
      - TYPE: STRUCT(DocAIErrorModel)
        STATUS: 409
        WHEN: Download requested before the job reached a terminal status (HTTP 409)
    CANONICAL_ID: sarvam_apis.job.downloadUrl.get
  sarvam_apis.speech_to_text_translate.create:
