      - TYPE: STRUCT(ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.completion.create
  sarvam_apis.completion.create1:
    SUMMARY: Chat Completion
    DESC: |-
      Creates a model response for the given chat conversation. OpenAI-compatible request and response shape; differences from OpenAI are called out in the Open-Source Models documentation.

      Requires `api-subscription-key`. Keys without beta access to this endpoint receive `400 invalid_request_error` before the model is called. Set `"stream": true` to receive the reply incrementally as server-sent events. Reasoning models return their chain-of-thought in a separate `reasoning_content` field on the message (`delta.reasoning_content` when streaming); reasoning tokens count against `max_tokens`.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/chat/completions
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(CreateChatCompletionV2Request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - body:
          TYPE: STRUCT(CreateChatCompletionV2Request)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(CreateChatCompletionV2Response)
        RETURNVAR: sarvam_apis_completion_create1
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Invalid request — a malformed field, a capability the model lacks (e.g. an image sent to a text-only model), or a remote image URL. (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Missing or invalid API key — returned as 403 invalid_api_key_error in practice. (HTTP 401)
      - TYPE: ANY
        STATUS: 403
        WHEN: Missing or invalid API key (`invalid_api_key_error`). (HTTP 403)
      - TYPE: ANY
        STATUS: 413
        WHEN: Request larger than 10 MB (text and inline images combined). (HTTP 413)
      - TYPE: ANY
        STATUS: 422
        WHEN: Request that cannot be served — e.g. estimated prompt tokens + max_tokens exceed the model's context window. (HTTP 422)
      - TYPE: ANY
        STATUS: 429
        WHEN: Rate limit exceeded. (HTTP 429)
    CANONICAL_ID: sarvam_apis.completion.create1
  sarvam_apis.model.list:
