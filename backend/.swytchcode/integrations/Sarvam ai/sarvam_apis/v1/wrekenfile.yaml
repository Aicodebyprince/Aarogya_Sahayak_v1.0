    INPUTS:
      - dict_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(Sarvam_Model_API_PronunciationDictionaryData)
        RETURNVAR: sarvam_apis_pronunciation-dictionary_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 400
        WHEN: Bad Request — Invalid JSON, missing required fields, or bad schema. (HTTP 400)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 404
        WHEN: Not Found — Dictionary not found. (HTTP 404)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.pronunciation-dictionary.get
  sarvam_apis.translate.create:
    SUMMARY: Translate Text
    DESC: |-
      **Translation** converts text from one language to another while preserving its meaning.
      For Example: **'मैं ऑफिस जा रहा हूँ'** translates to **'I am going to the office'** in English, where the script and language change, but the original meaning remains the same.

      Available languages:
      - **`bn-IN`**: Bengali
      - **`en-IN`**: English
      - **`gu-IN`**: Gujarati
      - **`hi-IN`**: Hindi
      - **`kn-IN`**: Kannada
      - **`ml-IN`**: Malayalam
      - **`mr-IN`**: Marathi
      - **`od-IN`**: Odia
      - **`pa-IN`**: Punjabi
      - **`ta-IN`**: Tamil
      - **`te-IN`**: Telugu

      ### Newly added languages:
      - **`as-IN`**: Assamese
      - **`brx-IN`**: Bodo
      - **`doi-IN`**: Dogri
      - **`kok-IN`**: Konkani
      - **`ks-IN`**: Kashmiri
      - **`mai-IN`**: Maithili
      - **`mni-IN`**: Manipuri (Meiteilon)
      - **`ne-IN`**: Nepali
      - **`sa-IN`**: Sanskrit
      - **`sat-IN`**: Santali
      - **`sd-IN`**: Sindhi
      - **`ur-IN`**: Urdu

      For hands-on practice, you can explore the notebook tutorial on [Translate API Tutorial](https://github.com/sarvamai/sarvam-ai-cookbook/blob/main/notebooks/translate/Translate_API_Tutorial.ipynb).
    HTTP:
      METHOD: POST
      ENDPOINT: /translate
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Sarvam_Model_API_TranslationRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - body:
          TYPE: STRUCT(Sarvam_Model_API_TranslationRequest)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(Sarvam_Model_API_TranslationResponse)
        RETURNVAR: sarvam_apis_translate_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.translate.create
  sarvam_apis.transliterate.create:
    SUMMARY: Transliterate Text
    DESC: |-
      **Transliteration** converts text from one script to another while preserving the original pronunciation. For example, **'नमस्ते'** becomes **'namaste'** in English, and **'how are you'** can be written as **'हाउ आर यू'** in Devanagari. This process ensures that the sound of the original text remains intact, even when written in a different script.

      Transliteration is useful when you want to represent words phonetically across different writing systems, such as converting **'मैं ऑफिस जा रहा हूँ'** to **'main office ja raha hun'** in English letters.

      **Translation**, on the other hand, converts text from one language to another while preserving the meaning rather than pronunciation. For example, **'मैं ऑफिस जा रहा हूँ'** translates to **'I am going to the office'** in English, changing both the script and the language while conveying the intended message.
      ### Examples of **Transliteration**:
      - **'Good morning'** becomes **'गुड मॉर्निंग'** in Hindi, where the pronunciation is preserved but the meaning is not translated.
      - **'सुप्रभात'** becomes **'suprabhat'** in English.

      Available languages:
      - **`en-IN`**: English
      - **`hi-IN`**: Hindi
      - **`bn-IN`**: Bengali
      - **`gu-IN`**: Gujarati
      - **`kn-IN`**: Kannada
      - **`ml-IN`**: Malayalam
      - **`mr-IN`**: Marathi
      - **`od-IN`**: Odia
      - **`pa-IN`**: Punjabi
      - **`ta-IN`**: Tamil
      - **`te-IN`**: Telugu

      For hands-on practice, you can explore the notebook tutorial on [Transliterate API Tutorial](https://github.com/sarvamai/sarvam-ai-cookbook/blob/main/notebooks/transliterate/Transliterate_API_Tutorial.ipynb).
    HTTP:
      METHOD: POST
      ENDPOINT: /transliterate
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Sarvam_Model_API_TransliterationRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
      - body:
          TYPE: STRUCT(Sarvam_Model_API_TransliterationRequest)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(Sarvam_Model_API_TransliterationResponse)
        RETURNVAR: sarvam_apis_transliterate_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded (HTTP 429)
      - TYPE: STRUCT(Sarvam_Model_API_ErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
    CANONICAL_ID: sarvam_apis.transliterate.create
  sarvam_apis.text_lid.create:
