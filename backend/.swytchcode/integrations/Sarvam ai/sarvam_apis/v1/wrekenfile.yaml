    DESC: |-
      **Legacy API.** The `/doc-digitization/job/v1` endpoints remain available for existing integrations. For new integrations, use the Document Intelligence API under `/doc-ai/v1`.

      Returns the current status of a job with page-level metrics.

      **Job States:**
      - `Accepted`: Job created, awaiting file upload
      - `Pending`: File uploaded, waiting to start
      - `Running`: Processing in progress
      - `Completed`: All pages processed successfully
      - `PartiallyCompleted`: Some pages succeeded, some failed
      - `Failed`: All pages failed or job-level error

      **Page Metrics:**
      Response includes detailed progress: total pages, pages processed, succeeded, failed, and per-page errors.
    HTTP:
      METHOD: GET
      ENDPOINT: /doc-digitization/job/v1/{job_id}/status
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - job_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          FORMAT: uuid
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(DocDigitizationJobStatusResponse)
        RETURNVAR: sarvam_apis_job_status_get1
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(DocDigitizationErrorMessage)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(DocDigitizationErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(DocDigitizationErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded / Rate Limited (HTTP 429)
      - TYPE: STRUCT(DocDigitizationErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(DocDigitizationErrorMessage)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: sarvam_apis.job.status.get1
  sarvam_apis.job.downloadFiles.create:
    SUMMARY: Get Document Intelligence Download URLs (Legacy)
    DESC: |-
      **Legacy API.** The `/doc-digitization/job/v1` endpoints remain available for existing integrations. For new integrations, use the Document Intelligence API under `/doc-ai/v1`.

      Returns presigned URLs for downloading output files.

      **Method:** POST only. A GET request to this path returns 405 Method Not Allowed.

      **Prerequisites:**
      - Job must be in `Completed` or `PartiallyCompleted` state
      - Failed jobs have no output available
    HTTP:
      METHOD: POST
      ENDPOINT: /doc-digitization/job/v1/{job_id}/download-files
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - job_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          FORMAT: uuid
      - api-subscription-key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(DocDigitizationDownloadFilesResponse)
        RETURNVAR: sarvam_apis_job_downloadFiles_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(DocDigitizationErrorMessage)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(DocDigitizationErrorMessage)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(DocDigitizationErrorMessage)
        STATUS: 429
        WHEN: Quota Exceeded / Rate Limited (HTTP 429)
      - TYPE: STRUCT(DocDigitizationErrorMessage)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(DocDigitizationErrorMessage)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: sarvam_apis.job.downloadFiles.create
